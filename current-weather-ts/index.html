<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="assets/css/styles.css">
    <title>Clima</title>
</head>

<body>
    <main class="glass-card">
        <header>
            <h1>Clima</h1>
            <time datetime="2026-01-28T17:25">quarta-feira, 17h23</time>
        </header>
        <section id="search-form">
            <input type="text" id="input-location">
            <button type="button" class="glass-card" id="input-location">Pesquisar</button>
        </section>
        <section id="weather-data">
            <div class="glass-card" id="weather-primary-data">
                <div>
                    <h2>São Paulo</h2>
                    <span>26°</span>
                </div>
                <img src="assets/images/icon.png" alt="">
            </div>
            <div class="glass-card" id="weather-secondary-data">
                <span>Parcialmente ensolarado</span>
                <span>Umidade: 59%</span>
                <span>Vento: 3 km/h</span>
            </div>
        </section>
    </main>
</body>

</html>
